<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Степан из Зюраткуля</title>

<script>(function(){try{var t=localStorage.getItem('stepan_theme');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}})()</script>
<style>
:root{color-scheme:light dark;box-sizing:border-box;--bg:#f2e9d8;--card:#fbf6ec;--ink:#3d2c1e;--acc:#b8763e;--ok:#5e9450;--xp:#8c629c;--en:#d49a35;--stroke:#e0d1b8;--ib:#efe2ca;}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.38 system-ui,-apple-system,sans-serif;}
#app{width:100%;max-width:500px;margin:0 auto;padding:8px 10px;display:flex;flex-direction:column;height:100vh;height:100dvh;transition:max-width .25s;}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;padding:8px 12px;background:var(--card);border-radius:14px;box-shadow:0 2px 8px #0001;margin-bottom:6px;border:1px solid var(--stroke);gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;background:var(--ib);padding:4px 9px;border-radius:20px;font-size:12.5px}
.bars{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:0 0 6px}
.bar{background:var(--card);border-radius:13px;padding:6px 9px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px #0001;border:1px solid var(--stroke)}
.ic-box{width:30px;height:30px;border-radius:8px;background:var(--ib);display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:3px}
.stat-ic{width:100%;height:100%;object-fit:contain;display:block}
.ui-ic{width:18px;height:18px;vertical-align:-3px;display:inline-block;flex-shrink:0}
.ui-ic.lg{width:24px;height:24px;vertical-align:-5px}
.bar-info{flex:1;min-width:0}
.bar-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;margin-bottom:3px}
.bar-head span:last-child{opacity:.75;font-size:11px}
.bar i{display:block;height:7px;border-radius:4px;background:#0002;overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,#b8763e,#d6955b);transition:width .3s}
.bar.xp-bar b{background:linear-gradient(90deg,#845896,#a97ab8)}
.bar.en-bar b{background:linear-gradient(90deg,#cf9432,#e6b85c)}
.bar.ok-bar b{background:linear-gradient(90deg,#528745,#76b065)}
.card{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 3px 10px #00000010;border:1px solid var(--stroke)}
button.b{background:linear-gradient(180deg,#c9864d,#a86832);color:#fffaf2;border:0;border-radius:11px;padding:9px 12px;font-size:14px;margin:2px;transition:transform 0.08s,filter 0.15s;font-weight:700;box-shadow:0 3px 0 #75441b;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.b:active{transform:translateY(2px);box-shadow:0 1px 0 #75441b}
button.b:disabled{opacity:.45;filter:grayscale(0.4);transform:none;box-shadow:none;cursor:default}
button.exit-btn{background:linear-gradient(180deg,#6c8496,#526778);box-shadow:0 3px 0 #374652;width:100%;font-size:15px;padding:10px;margin:2px 0 0;}
.tab-strip{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.tab-strip button{flex:1;min-width:68px;padding:7px 8px;font-size:12px;border-radius:10px;background:var(--ib);color:var(--ink);border:1px solid var(--stroke);font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.tab-strip button.act{background:var(--acc);color:#fff;border-color:#8a5224}
svg.scene-svg{width:100%;max-height:330px;display:block;border-radius:14px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:360px;margin:0 auto}
.t{aspect-ratio:1;border:0;border-radius:12px;background:#e6d4b2;padding:7px;transition:transform .12s;box-shadow:0 3px 0 #c4ae87;cursor:pointer;display:flex;align-items:center;justify-content:center}
.t svg{width:100%;height:100%}
.t.s{outline:3px solid #c96540;transform:scale(1.07)}.t.x{transform:scale(0);}
.m3-card{position:relative;overflow:hidden;width:100%;max-width:500px;margin-left:auto;margin-right:auto;background:linear-gradient(180deg,var(--card) 0%,var(--ib) 55%,var(--card) 100%);border-color:var(--stroke);box-shadow:0 5px 16px #7550401a}
.m3-heading{display:flex;align-items:center;gap:7px;margin:0 auto 8px;max-width:360px;color:var(--ink);font-weight:900;font-size:16px}
.m3-heading-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe7a0,#f6bd55);box-shadow:inset 0 1px 0 #fff9,0 2px 0 #ca8d41}
.m3-heading-icon svg{width:20px;height:20px}
.m3-mode{margin-left:auto;padding:4px 9px;border-radius:99px;background:var(--card);border:1px solid var(--stroke);color:var(--acc);font-size:11px;letter-spacing:.08em}
.m3-card .m3-top{max-width:360px;margin:0 auto 8px!important;background:linear-gradient(180deg,#fff3c8,#ffdf8b);border:1px solid #e9b74f;color:#66431e;box-shadow:0 2px 5px #84582922}
.m3-landscape{width:100%;max-width:360px;aspect-ratio:360/120;margin:9px auto 11px;overflow:hidden;border-radius:17px;border:3px solid #fffaf0;box-shadow:0 4px 10px #65405533,0 0 0 1px #d8a678}
.m3-landscape svg{display:block;width:100%;height:100%}
.m3-board-shell{width:100%;max-width:360px;margin:0 auto 8px;padding:6px;border:2px solid #fff1d6;border-radius:18px;background:linear-gradient(145deg,#bd73a9,#804e91 56%,#a4649c);box-shadow:inset 0 3px 8px #4b2b5a66,0 4px 0 #744c69}
.grid.m3-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:100%;max-width:none;margin:0 auto}
.m3-grid .t{position:relative;overflow:hidden;min-width:0;min-height:0;padding:5px;border:2px solid #fff8;border-radius:13px;box-shadow:inset 0 2px 3px #fff9,inset 0 -5px 7px #4021432b,0 2px 0 #5c3d68;transition:transform .12s,filter .12s,box-shadow .12s;touch-action:manipulation}
.m3-grid .t::before{content:"";position:absolute;left:9%;top:7%;width:34%;height:16%;border-radius:50%;background:#ffffff8c;transform:rotate(-25deg);pointer-events:none}
.m3-grid .t svg{position:relative;z-index:1;filter:drop-shadow(0 1px 1px #61405455)}
.m3-grid .t.candy-0{background:linear-gradient(145deg,#ffe88d,#f3a932)}
.m3-grid .t.candy-1{background:linear-gradient(145deg,#a8eaff,#55abd9)}
.m3-grid .t.candy-2{background:linear-gradient(145deg,#ffe3a2,#e9943d)}
.m3-grid .t.candy-3{background:linear-gradient(145deg,#c9ef9e,#6eb65e)}
.m3-grid .t.candy-4{background:linear-gradient(145deg,#ffb9a8,#e76c67)}
.m3-grid .t.candy-5{background:linear-gradient(145deg,#dfc2ff,#a47bc9)}
.m3-grid .t.candy-empty{background:linear-gradient(145deg,#e7c6a5,#c9987c);opacity:.55}
.m3-grid .t.s{outline:3px solid #fff;outline-offset:-3px;transform:scale(1.07);filter:brightness(1.12);box-shadow:0 0 0 3px #ffda61,0 0 13px #fff7,0 3px 0 #5c3d68;z-index:2}
.m3-grid .t.x{transform:scale(.15) rotate(12deg);opacity:0}
.m3-grid .t:focus-visible{outline:3px solid #fff;outline-offset:-3px;box-shadow:0 0 0 4px #ffd75e,0 0 12px #fff8}
.m3-msg{color:#66433b}
@media (prefers-reduced-motion:reduce){.m3-grid .t{transition:none!important}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #0001}
.row:last-child{border-bottom:0}
.row small{display:block;font-size:11px;opacity:.72;font-weight:400;margin-top:2px}
.q-bar{height:6px;background:#0002;border-radius:3px;overflow:hidden;margin-top:4px;width:100%}
.q-bar b{display:block;height:100%;background:linear-gradient(90deg,#5e9450,#80ba70);transition:width .3s}
.msg{text-align:center;min-height:24px;font-weight:700;margin:5px 0;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
@keyframes bob{50%{transform:translateY(5px)}}@keyframes br{50%{transform:scale(1.02)}}
.bear{animation:br 3s infinite;transform-origin:100px 150px}
#wv{position:relative;overflow:hidden;height:min(65vh,560px);border-radius:16px;background:#558c42;touch-action:none;box-shadow:0 6px 18px #0004;border:2px solid var(--stroke);contain:strict;margin:0 auto;width:100%}
#wm{position:relative;will-change:transform;backface-visibility:hidden;transform-origin:top left}#wm svg{width:auto;border-radius:0;display:block}
#wm.tr,#wm.tr #pl,#wm.tr #pl2{transition:transform .2s linear}
#pl{position:absolute;left:0;top:0;width:62px;pointer-events:none;z-index:2;will-change:transform;backface-visibility:hidden}#pl svg{width:62px;transition:transform .15s}
#pl2{position:absolute;left:0;top:0;width:46px;pointer-events:none;z-index:1;will-change:transform;backface-visibility:hidden}#pl2 svg{width:46px;transition:transform .15s}
#pl.walk .bear,#pl2.walk .bear{animation:wk .2s infinite}
#ov{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 55px #0004;z-index:3}
.sh{animation:shm 2.8s infinite ease-in-out}
@keyframes wk{50%{transform:translateY(-6px) rotate(4deg)}}@keyframes shm{50%{opacity:.25;transform:translateX(3px)}}
.mk{position:absolute;width:32px;height:32px;border:3px solid #fff;border-radius:50%;animation:mk .7s forwards;pointer-events:none;z-index:4}@keyframes mk{to{transform:scale(1.8);opacity:0}}
.ff{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe97a;box-shadow:0 0 8px 3px #ffe97a;animation:ff 3s infinite;pointer-events:none;z-index:3}@keyframes ff{50%{opacity:.1;transform:translate(14px,-18px)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#241a12f0;color:#fffaf0;padding:10px 18px;border-radius:22px;z-index:99;font-weight:700;animation:tin .2s;text-align:center;box-shadow:0 4px 15px #0006;white-space:pre-line}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.pop{position:fixed;pointer-events:none;font-weight:900;font-size:16px;z-index:99;animation:popUp .9s forwards;text-shadow:0 2px 4px #0008;will-change:transform,opacity}
@keyframes popUp{0%{opacity:1;transform:translateY(0) scale(0.8)}50%{transform:translateY(-18px) scale(1.1)}100%{opacity:0;transform:translateY(-36px) scale(1)}}
.rain{position:absolute;inset:0;pointer-events:none;opacity:0.55;background-image:url("data:image/svg+xml,%3Csvg width='30' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cline x1='15' y1='0' x2='5' y2='40' stroke='%23fff' stroke-width='1.5' opacity='0.4'/%3E%3C/svg%3E");animation:fall 0.4s linear infinite;z-index:3}
@keyframes fall{from{background-position:0 0;}to{background-position:-20px 100px;}}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:8px}
canvas{background:#1c1612;border-radius:14px;width:100%;max-width:440px;margin:0 auto;display:block;box-shadow:inset 0 4px 10px #0006;touch-action:none;}


.upg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}
.upg-box{background:var(--ib);border:1px solid var(--stroke);border-radius:12px;padding:7px;text-align:center;font-size:12px}
.upg-box b{display:block;font-size:13px;margin-bottom:2px}
.dual-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:680px){
  #app{max-width:860px;padding:12px 18px;}
  .bars{grid-template-columns:repeat(4,1fr);gap:8px;}
  #wv{height:min(70vh,620px);max-width:672px;}
  .dual-grid{grid-template-columns:1fr 1fr;align-items:start;}
  .upg-grid{grid-template-columns:repeat(4,1fr);}
  svg.scene-svg{max-height:360px;}
  canvas{max-width:460px;}
}
@media (min-width:1024px){
  #app{max-width:960px;}
}

@keyframes swimR{from{transform:translateX(-60px)}to{transform:translateX(430px)}}
@keyframes swimL{from{transform:translateX(430px)}to{transform:translateX(-60px)}}
@keyframes fApproach{from{transform:translate(80px,26px);opacity:.2}to{transform:translate(0,0);opacity:1}}
@keyframes fWig{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes fThrash{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bobw{50%{transform:translateY(2px)}}
@keyframes nib{0%,100%{transform:translateY(0)}35%{transform:translateY(4px)}65%{transform:translateY(1px)}}
@keyframes dip{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes castX{from{transform:translateX(-52px)}to{transform:translateX(0)}}
@keyframes castY{0%{transform:translateY(-42px);animation-timing-function:ease-out}38%{transform:translateY(-92px);animation-timing-function:ease-in}100%{transform:translateY(0)}}
@keyframes jumpX{0%{transform:translateX(0);opacity:1}88%{opacity:1}100%{transform:translateX(-140px);opacity:0}}
@keyframes jumpY{0%{transform:translateY(0);animation-timing-function:ease-out}45%{transform:translateY(-84px);animation-timing-function:ease-in}100%{transform:translateY(-10px)}}
@keyframes jumpR{from{transform:rotate(25deg)}to{transform:rotate(-30deg)}}
@keyframes twk{0%,100%{opacity:0}50%{opacity:1}}
@keyframes ench{0%,100%{opacity:.15}50%{opacity:.85}}
@keyframes popI{from{transform:translateY(0) scale(1)}to{transform:translateY(-4px) scale(1.12)}}
@keyframes cloudD{from{transform:translateX(0)}to{transform:translateX(70px)}}
@keyframes spl{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--sx),-24px);opacity:0}}
.shopc .card{padding:7px 10px;margin-bottom:5px}
.shopc .row{padding:4px 0;gap:6px}
.shopc .row small{font-size:11px;margin-top:0;line-height:1.2}
.shopc .row span{font-size:13px;line-height:1.2}
.shopc button.b{padding:5px 10px;font-size:12px;margin:0}
.shopc .tab-strip{margin-bottom:5px}.shopc .tab-strip button{padding:5px 6px;font-size:11px;min-width:60px}
.shopc button.exit-btn{padding:7px;font-size:13px}



.thimble-room{position:relative;overflow:hidden;max-width:360px;margin:8px auto 10px;border:2px solid #8c5d33;border-radius:14px;aspect-ratio:360/240;box-shadow:0 3px 8px #0001}
.thimble-room>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.thim-cup{position:absolute;width:50px;height:62px;padding:0;border:0;background:transparent;cursor:pointer;z-index:2;left:var(--cup-x);top:62%;transform:translate(calc(-50% + var(--shake-x,0px)),calc(-50% + var(--shake-y,0px) + var(--lift,0px))) rotate(var(--rot,0deg));transition:left var(--dur,.3s) cubic-bezier(.5,-.12,.3,1.22),transform var(--dur,.3s) cubic-bezier(.34,1.5,.5,1),filter .12s ease;filter:drop-shadow(0 3px 1px #0003)}
.thim-cup:disabled{cursor:default}
.thim-gem{position:absolute;left:var(--cup-x,52%);top:72%;width:34px;height:29px;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:1;transition:left var(--dur,.3s) ease-in-out,opacity .25s,transform .25s;pointer-events:none;filter:drop-shadow(0 0 10px #4ecdc4)}
.thim-gem.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.thim-gem svg{width:100%;height:100%;display:block}
.thim-cup svg{width:100%;height:100%;display:block}
.thim-cup:hover,.thim-cup:focus-visible{filter:drop-shadow(0 0 8px #ffe28a);outline:none}

.memory-room{overflow:hidden;width:100%;max-width:360px;margin:10px auto 8px;border-radius:13px;border:1px solid #73553a;box-shadow:0 4px 10px #0002}
.memory-room svg{display:block;width:100%;height:auto}


.card-table-scene{overflow:hidden;width:100%;max-width:360px;margin:8px auto 10px;border-radius:14px;border:2px solid #8c5d33;box-shadow:0 3px 8px #0001;aspect-ratio:360/160;background:#f5ebe0}
.card-table-scene svg{display:block;width:100%;height:auto}
.coin-arena,.dart-scene,.catch-scene{overflow:hidden;width:100%;max-width:360px;margin:8px auto 10px;border-radius:14px;border:1.5px solid #6b4424;box-shadow:0 3px 10px #0003;position:relative}
.coin-arena{overflow:hidden;width:100%;max-width:360px;margin:8px auto 10px;border-radius:14px;border:2px solid #8c5d33;box-shadow:0 3px 8px #0001;position:relative;aspect-ratio:360/210}
.coin-arena>svg{display:block;width:100%;height:auto}

/* === ЖИВОЙ ТАКТИЛЬНЫЙ UI И ДЕТАЛИ === */
.sound-toggle-btn{width:28px;height:28px;border-radius:9px;background:var(--ib);border:1px solid var(--stroke);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:14px;box-shadow:0 1px 3px #0001;transition:transform .12s,background .15s}
.sound-toggle-btn:active{transform:scale(0.92)}
.sound-toggle-btn:hover{background:var(--card)}

.home-scene-wrap{position:relative;width:100%;max-width:360px;margin:0 auto;cursor:pointer}
.pet-hint-badge{position:absolute;right:10px;bottom:10px;background:rgba(30,20,12,0.68);color:#fffaf0;font-size:11px;font-weight:800;padding:3px 9px;border-radius:12px;pointer-events:none;backdrop-filter:blur(6px);box-shadow:0 2px 6px #0004;letter-spacing:.02em;transition:opacity .2s}
.pet-bounce{animation:petWiggle .42s cubic-bezier(0.34,1.56,0.64,1)!important}
@keyframes petWiggle{0%{transform:scale(1)}25%{transform:scale(1.08,0.92) rotate(-3deg)}50%{transform:scale(0.94,1.06) rotate(3deg)}75%{transform:scale(1.03,0.98) rotate(-1deg)}100%{transform:scale(1)}}

.pop-heart{position:fixed;pointer-events:none;font-size:26px;z-index:9999;animation:popHeart .85s cubic-bezier(0.2,0.8,0.25,1) forwards;filter:drop-shadow(0 2px 6px rgba(220,50,50,0.45));will-change:transform,opacity}
@keyframes popHeart{0%{opacity:0;transform:translateY(0) scale(0.5)}25%{opacity:1;transform:translateY(-18px) scale(1.3)}80%{opacity:1;transform:translateY(-48px) scale(1)}100%{opacity:0;transform:translateY(-72px) scale(0.7)}}

.sparkle-particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:9999;box-shadow:0 0 10px currentColor,0 0 4px #fff;animation:sparkleFly .65s cubic-bezier(0.12,0.8,0.32,1) forwards;will-change:transform,opacity}
@keyframes sparkleFly{0%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0.2);opacity:0}}

.desktop-kbd-hint{font-size:11px;color:var(--ink);opacity:.68;text-align:center;margin:4px auto 0;font-weight:600}

button.b:active{transform:translateY(2px) scale(0.98)!important}

@keyframes popUp{0%{opacity:0;transform:translateY(6px) scale(0.8)}25%{opacity:1;transform:translateY(-8px) scale(1.15)}80%{opacity:1;transform:translateY(-22px) scale(1)}100%{opacity:0;transform:translateY(-38px) scale(0.85)}}


/* ===== РЕДИЗАЙН: Уютная тайга ===== */
:root{--honey:#E59838;--honey-hover:#F2A849;--moss:#4E8543;--moss-light:#6EAB61;--berry:#BD4557;--lake:#3B7E9E;--ink-soft:#6f5b49;--line:rgba(138,98,58,.15);--sb:max(8px,env(safe-area-inset-bottom));--st:max(8px,env(safe-area-inset-top))}
html,body{font-family:'Nunito',system-ui,-apple-system,sans-serif;scrollbar-width:none;background:var(--bg);color:var(--ink)}
::-webkit-scrollbar{display:none}
button,input,select,textarea{font-family:inherit}
#app{height:100dvh;padding-top:var(--st);padding-bottom:var(--sb)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 8px 24px rgba(70,45,25,.08)}
/* шапка: полные бары только в Берлоге */
body:not([data-tab="home"]) #hud .bars{display:none}
body:not([data-tab="home"]) #hud .top{margin-bottom:4px}
/* кнопки: primary / success / secondary / ghost */
button.b,.btn-primary{background:linear-gradient(180deg,var(--honey-hover),var(--honey));color:#fffaf2;border:0;border-radius:14px;font-weight:800;box-shadow:0 3px 0 #a8651d,inset 0 1px 0 rgba(255,255,255,.35)}
.btn-success{background:linear-gradient(180deg,var(--moss-light),var(--moss))!important;box-shadow:0 3px 0 #33602c,inset 0 1px 0 rgba(255,255,255,.3)!important}
.btn-secondary{background:linear-gradient(180deg,#f1e2c8,#e2cba4)!important;color:var(--ink)!important;box-shadow:0 3px 0 #b8996a!important}
.btn-ghost,.exit-btn{background:rgba(255,253,249,.82)!important;color:var(--ink)!important;border:1.5px solid rgba(138,98,58,.3)!important;box-shadow:0 3px 0 rgba(138,98,58,.2)!important;backdrop-filter:blur(8px)}
.exit-btn{position:sticky;bottom:8px;width:100%;z-index:5;font-weight:800}
button:active:not(:disabled){transform:scale(.96) translateY(1px)!important;transition:transform .08s ease}
@media (hover:none){button:hover{filter:none!important}}
/* нижний док */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--sb);width:min(480px,calc(100% - 20px));display:flex;gap:4px;padding:6px;border-radius:24px;background:rgba(255,253,249,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid var(--line);box-shadow:0 8px 24px rgba(70,45,25,.18);z-index:50}
#dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;font-weight:800;font-size:11px;color:var(--ink-soft);padding:6px 2px;border-radius:18px;box-shadow:none}
#dock button.on{background:linear-gradient(180deg,var(--honey-hover),var(--honey));color:#fff;box-shadow:0 2px 0 #a8651d}
#dock .ui-ic{width:22px;height:22px;vertical-align:0}
body:not([data-nav="1"]) #dock{display:none}
body[data-nav="1"] #main{padding-bottom:84px}
/* переходы между экранами */
@keyframes fxUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#main.fx{animation:fxUp .22s ease both}
html[data-theme="dark"] #dock{background:rgba(36,28,22,.85);border-color:rgba(230,200,160,.15)}html[data-theme="dark"] #dock button.on{color:#fff}html[data-theme="dark"] .btn-ghost,html[data-theme="dark"] .exit-btn{background:rgba(45,35,28,.9)!important;color:var(--ink)!important;border-color:var(--line)!important}
body[data-nav="1"] .exit-btn{display:none}
#dock button.on .ui-ic{animation:dockPop .35s cubic-bezier(.34,1.56,.64,1)}@keyframes dockPop{from{transform:scale(.7) translateY(4px)}to{transform:none}}
#pedals{position:fixed;left:0;right:0;bottom:var(--sb);display:none;justify-content:space-between;padding:0 14px;z-index:60;pointer-events:none}
body[data-tab="race"] #pedals{display:flex}
#pedals button{pointer-events:auto;width:96px;height:78px;border-radius:24px;border:1.5px solid rgba(255,255,255,.6);color:#fff;font-weight:900;font-size:13px;backdrop-filter:blur(8px);touch-action:none}
#pedals .brake{background:rgba(189,69,87,.78)}#pedals .gas{background:rgba(78,133,67,.82)}

/* ===== Клуб «Зюраткуль»: общий лаундж ===== */
.card.club-card{position:relative;max-width:500px;margin-left:auto;margin-right:auto;overflow:hidden;color:#F3E6CF;border:2px solid #8a5a22!important;background:radial-gradient(120% 55% at 50% -8%,rgba(255,196,110,.24),transparent 62%),repeating-linear-gradient(91deg,rgba(255,236,200,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(89deg,rgba(0,0,0,.1) 0 1px,transparent 1px 14px),linear-gradient(180deg,#4b2a16,#2f1a0d 58%,#22130a)!important;box-shadow:inset 0 0 0 1px rgba(255,215,150,.16),inset 0 2px 0 rgba(255,225,170,.2),0 12px 30px rgba(20,10,4,.42)!important}
html[data-theme="light"] .card.club-card{background:radial-gradient(120% 55% at 50% -8%,rgba(255,214,140,.34),transparent 62%),repeating-linear-gradient(91deg,rgba(255,236,200,.05) 0 2px,transparent 2px 9px),repeating-linear-gradient(89deg,rgba(0,0,0,.08) 0 1px,transparent 1px 14px),linear-gradient(180deg,#6e4024,#4c2b16 58%,#3a2011)!important}
.club-card::before{content:"";position:absolute;left:50%;top:0;width:70px;height:9px;transform:translateX(-50%);border-radius:0 0 12px 12px;background:linear-gradient(180deg,#f7d98b,#b8862e);box-shadow:0 0 22px 8px rgba(255,200,110,.32);pointer-events:none}
.club-title{display:block;margin:6px 0 2px;color:#FFD98A;font-size:18px;font-weight:1000;letter-spacing:.04em;text-shadow:0 1px 0 #000,0 0 14px rgba(255,190,90,.35)}
.club-card .msg{max-width:430px;margin:8px auto;padding:7px 10px;border:1px solid rgba(255,210,140,.2);border-radius:12px;background:rgba(0,0,0,.3);color:#F6E7CC;box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.club-card .msg b{color:#FFD98A}
.club-card small{color:#E3CFAD}
.club-card .card-table-scene,.club-card .thimble-room,.club-card .coin-arena,.club-card .memory-room,.club-card .mine-banner{border-color:#8a5a22;box-shadow:0 4px 14px rgba(0,0,0,.4)}
html[data-theme="dark"] .club-card .scene-svg,html[data-theme="dark"] .club-card .thimble-room>svg,html[data-theme="dark"] .club-card .mine-banner svg{filter:brightness(.84) saturate(.92)}
.b.club-btn{background:linear-gradient(180deg,#f6cf6a,#c98a22)!important;color:#3a2208!important;border:1px solid #7a4f12!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 0 #6b4210,0 8px 16px rgba(0,0,0,.3)!important;font-weight:1000!important;letter-spacing:.03em}
.b.club-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #6b4210!important}
.b.club-btn:disabled{filter:saturate(.45) brightness(.85);opacity:.72}
.b.club-btn.ruby{background:linear-gradient(180deg,#d94a5c,#8e1c2e)!important;color:#fff4e8!important;border-color:#5a0f1b!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #4f0d18,0 8px 16px rgba(0,0,0,.3)!important}
.b.club-btn.emerald{background:linear-gradient(180deg,#45b071,#1d6b3e)!important;color:#f2fff6!important;border-color:#0f4024!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #0f3d22,0 8px 16px rgba(0,0,0,.3)!important}
.club-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.club-row .b{flex:1;min-width:120px}
.club-coin{position:fixed;z-index:120;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:none;animation:coinFly 1.2s cubic-bezier(.2,.6,.4,1) forwards}
.club-coin svg{width:100%;height:100%;display:block}
@keyframes coinFly{0%{transform:translate(0,0) rotate(0) scale(.5);opacity:1}40%{transform:translate(calc(var(--tx) * .6),var(--ty)) rotate(220deg) scale(1)}100%{transform:translate(var(--tx),calc(var(--ty) + 240px)) rotate(560deg) scale(.9);opacity:0}}

/* ===== Слоты «Три ягоды» ===== */
.slot-card{max-width:500px;margin-left:auto;margin-right:auto}

.slot-housing{position:relative;padding:8px;border-radius:16px;border:2px solid #6b4413;background:linear-gradient(180deg,#ecc66e,#a8761f);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.25)}
.slot-caption{margin:0 0 6px;color:#4a2c0c;font-size:10.5px;font-weight:1000;letter-spacing:.18em;text-align:center}

.slot-reel-window::after{content:"";position:absolute;inset:0;z-index:2;border-radius:8px;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.12) 26%,rgba(255,255,255,.24) 44%,rgba(255,255,255,0) 56%,rgba(0,0,0,.12) 74%,rgba(0,0,0,.62) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 6px 0 10px rgba(0,0,0,.25),inset -6px 0 10px rgba(0,0,0,.25)}

.slot-machine.win{box-shadow:inset 0 0 0 2px #6b4413,0 0 0 3px #3a210c,0 0 22px rgba(241,196,15,.55),0 12px 26px rgba(0,0,0,.5)}

.mem-card.nope .mem-front{animation:memNope .35s}
@keyframes memNope{25%{transform:rotateY(180deg) translateX(-3px)}75%{transform:rotateY(180deg) translateX(3px)}}
.mem-card.matched{pointer-events:none;animation:memVanish .45s .5s ease-in forwards}
.mem-card.matched .mem-front{animation:memFlash .5s ease-out forwards}
@keyframes memFlash{0%{box-shadow:inset 0 0 0 3px #4ade80,0 0 0 0 rgba(74,222,128,.9)}50%{background:linear-gradient(150deg,#e3ffd9,#b6f0a2);box-shadow:inset 0 0 0 3px #4ade80,0 0 22px 8px rgba(74,222,128,.75)}100%{box-shadow:inset 0 0 0 3px #4ade80,0 0 10px 3px rgba(74,222,128,.5)}}
@keyframes memVanish{to{opacity:0;transform:scale(.5) rotate(8deg)}}
.mem-card.gone{visibility:hidden;pointer-events:none}

/* ===== Монетка ===== */
.coin-position{position:absolute;left:71%;top:68%;width:66px;height:66px;transform:translate(-50%,-50%);perspective:520px}
#cf-coin{position:relative;width:66px;height:66px;transform-style:preserve-3d;will-change:transform}
.cf-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf-face svg{display:block;width:100%;height:100%}
.cf-back{transform:rotateX(180deg)}
.cf-shadow{position:absolute;left:50%;bottom:-10px;width:56px;height:10px;margin-left:-28px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.45),transparent 70%)}
.coin-choice-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.coin-choice{display:flex;align-items:center;gap:8px;min-width:0;min-height:64px;padding:8px 10px;border-radius:16px;border:1px solid rgba(255,220,150,.45);color:#fff3d6;font-weight:900;text-align:left;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 48%,rgba(0,0,0,.12)),linear-gradient(135deg,#8a5a1c,#4a2c0c);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 #2a1607,0 8px 16px rgba(0,0,0,.3);transition:transform .15s,box-shadow .2s,filter .2s}
.coin-choice.tails{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 48%,rgba(0,0,0,.12)),linear-gradient(135deg,#2f6b4a,#173a28)}
.coin-choice:active{transform:translateY(2px)}
.coin-choice:disabled{cursor:default}
.coin-choice:disabled:not(.picked){opacity:.5;filter:grayscale(.35)}
.coin-choice.picked{border-color:#ffd34d;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 3px rgba(255,211,77,.55),0 0 22px rgba(255,211,77,.6),0 4px 0 #2a1607}
.coin-choice.won{border-color:#7ee081;box-shadow:0 0 0 3px rgba(126,224,129,.6),0 0 24px rgba(126,224,129,.6)}
.coin-choice.lost{border-color:#ff8a7a;box-shadow:0 0 0 3px rgba(255,138,122,.45)}
.coin-choice .coin-token{flex:0 0 40px;width:40px;height:40px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.coin-choice .coin-token svg{display:block;width:100%;height:100%}
.coin-choice small{display:block;margin-top:2px;color:#f0dcb4;font-size:11px;font-weight:700}

/* ===== Колесо Удачи ===== */
.wheel-wrap{position:relative;width:min(84vw,270px);aspect-ratio:1;margin:18px auto 8px}
.wheel-rim,.wheel-disc{position:absolute;display:block}
.wheel-rim{inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.wheel-disc{inset:4.5%;width:91%;height:91%;transition:transform 4.2s cubic-bezier(.12,.72,.18,1);will-change:transform}
.wb{animation:wbRun 1.5s linear infinite;animation-delay:calc(var(--i) * -.075s)}
@keyframes wbRun{0%,55%,100%{fill:#7a5a1c;opacity:.75}12%{fill:#fff6c8;opacity:1}}
.wheel-wrap.spinning .wb{animation-duration:.55s}
.wheel-pointer{position:absolute;left:50%;top:-14px;z-index:3;width:30px;height:44px;transform:translateX(-50%) rotate(0deg);transform-origin:50% 9px;transition:transform .22s cubic-bezier(.3,1.9,.5,1);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.wheel-pointer svg{display:block;width:100%;height:100%}
.wh-sec.win{animation:secFlash .32s steps(2) 8}
@keyframes secFlash{0%{filter:brightness(1)}100%{filter:brightness(1.7)}}
.wheel-legend{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px auto 2px;max-width:380px}
.wheel-legend span{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid rgba(241,196,15,.3);color:#f3e6cf;font-size:11px;font-weight:800}
.wheel-legend i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}

/* ===== Поляна Кротов ===== */
.mole-field{max-width:310px;margin:10px auto;padding:12px;border-radius:18px;background:linear-gradient(180deg,rgba(255,230,180,.14),transparent 40%),repeating-linear-gradient(90deg,#8a5a2e 0 26px,#6f4521 26px 28px);box-shadow:inset 0 0 0 3px #4a2c14,inset 0 -6px 0 rgba(0,0,0,.18),0 4px 0 #3a2210,0 8px 18px rgba(0,0,0,.25)}
.mole-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0;padding:10px;border-radius:14px;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.07) 0 1.6px,transparent 2.6px) 0 0/17px 17px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.2) 0 1.8px,transparent 2.8px) 0 0/23px 23px,linear-gradient(160deg,#7b5634,#5a3b22);box-shadow:inset 0 3px 10px rgba(0,0,0,.45)}
.mole-hole{position:relative;aspect-ratio:1;border-radius:22%;cursor:pointer;user-select:none;touch-action:manipulation;background:radial-gradient(ellipse 40% 17% at 50% 72%,#0d0704 0 62%,#2a170b 88%,transparent 100%),radial-gradient(ellipse 52% 26% at 50% 73%,#a7774a 0 55%,#7a5130 82%,transparent 100%);transition:transform .1s}
.mole-hole:active{transform:scale(.94)}
.mole-slot{position:absolute;left:8%;right:8%;top:0;bottom:28%;overflow:hidden;pointer-events:none}
.mole-pop{position:absolute;left:6%;right:6%;bottom:0;display:block;animation:molePop .3s cubic-bezier(.2,.9,.3,1.3) both}
.mole-pop svg,.mole-pop .ui-ic{display:block;width:100%!important;height:auto!important}
@keyframes molePop{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
.mole-pop.bonk{animation:moleBonk .38s ease-in forwards}
@keyframes moleBonk{0%{transform:scale(1.1,.8)}30%{transform:scale(.95,1.05)}100%{transform:translateY(100%)}}
.mole-lamp{animation:lampFlicker 2.2s ease-in-out infinite}
@keyframes lampFlicker{0%,100%{opacity:1}50%{opacity:.75}}
.mole-stars{position:absolute;left:50%;top:6%;z-index:3;width:46px;height:18px;margin-left:-23px;pointer-events:none;animation:starsSpin .55s linear 1 forwards}
.mole-stars svg{display:block;width:100%;height:100%}
@keyframes starsSpin{0%{opacity:0;transform:scale(.4) rotate(0)}30%{opacity:1;transform:scale(1.1) rotate(25deg)}100%{opacity:0;transform:scale(1) rotate(80deg) translateY(-6px)}}

/* ===== Фреш-бар ===== */
.bar-shelf{max-width:380px;margin:8px auto 10px;overflow:hidden;border-radius:14px;border:2px solid #8a5a22;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.bar-shelf svg{display:block;width:100%;height:auto}
.drink-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:460px;margin:0 auto}
.drink-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 8px;border-radius:14px;border:1px solid rgba(255,210,140,.22);background:linear-gradient(180deg,rgba(255,200,120,.1),rgba(0,0,0,.25));box-shadow:inset 0 1px 0 rgba(255,230,180,.18),0 3px 8px rgba(0,0,0,.3);text-align:center}
.drink-ic{width:52px;height:52px;filter:drop-shadow(0 0 10px rgba(255,180,80,.35))}
.drink-ic svg{display:block;width:100%;height:100%}
.drink-card b{color:#FFE3A8;font-size:13px;line-height:1.15}
.drink-card small{font-size:11px;line-height:1.2;opacity:.85}
.drink-fx{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;min-height:20px}
.fx-badge{padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:900;line-height:1.4;color:#1d1206;background:#f2b54a}
.fx-badge.mood{background:#f29bb8}
.fx-badge.food{background:#9fd67a}
.fx-badge.heal{background:#8fd8e8}
.fx-badge.all{background:linear-gradient(90deg,#f2b54a,#f29bb8,#9fd67a)}
.drink-buy{width:100%;margin-top:auto!important;padding:8px!important;font-size:14px!important}
.vip-tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#f1c40f;color:#3a2208;font-size:11px;letter-spacing:.06em;vertical-align:middle}
@media (prefers-reduced-motion:reduce){.mine-loot,.b.mine-cashout,.slot-brand,.wb,html[data-theme="dark"] body::before,html[data-theme="dark"] body::after{animation:none!important}}

/* ===== Клуб v3: единая оболочка, крупье, интерьерные столы ===== */
.card.club-card.cg{padding:12px 12px 14px;text-align:center}
.cg-head{display:grid;grid-template-columns:40px 1fr 54px;align-items:center;gap:8px;margin:4px 0 10px}
.cg-back{width:38px;height:38px;display:grid;place-items:center;padding:0;border-radius:12px;border:1px solid rgba(255,214,140,.38);background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(0,0,0,.2));color:#FFD98A;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 0 rgba(0,0,0,.4)}

.cg-name{min-width:0}
.cg .club-title{margin:0;font-size:17px;line-height:1.15}
.cg-sub{display:block;margin-top:3px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:rgba(243,230,207,.6)!important}
.cg-side{display:flex;justify-content:flex-end}
.cg-chip{display:inline-grid;grid-template-columns:auto auto;align-items:center;justify-content:center;column-gap:2px;min-width:50px;padding:4px 6px 5px;border-radius:13px;background:radial-gradient(circle at 50% 25%,#3d2b14,#1c1209);border:1px solid #c9973f;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 0 14px rgba(255,190,90,.18)}
.cg-chip small{grid-column:1/-1;font-size:8.5px!important;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,217,138,.7)!important;line-height:1}
.cg-chip b{font-size:16px;line-height:1.15;color:#FFD98A}
.cg-chip svg,.cg-chip img{width:14px;height:14px;vertical-align:-2px}
.cg .vip-tag{margin:0}

.cg-dealer{display:flex;align-items:center;gap:11px;max-width:440px;margin:0 auto 12px;text-align:left}
.cg-ava{flex:0 0 54px;width:54px;height:54px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#6a4520,#24160a 75%);border:2px solid #c9973f;box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 18px rgba(255,190,90,.28);transform-origin:50% 90%}
.cg-ava svg{display:block;width:100%;height:100%}
.cg-bubble{position:relative;flex:1;min-width:0;min-height:42px;padding:9px 12px;border-radius:15px;background:linear-gradient(180deg,#F6EAD3,#E6D3AF);color:#3a2412;font-size:13.5px;font-weight:700;line-height:1.38;box-shadow:0 3px 0 rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.6);transition:box-shadow .25s}
.cg-bubble::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:0;border-right-color:#EEDDBF}
.cg-bubble b{color:#8e1b2b}
.cg-bubble svg,.cg-bubble img{width:15px;height:15px;vertical-align:-3px}
.cg-bubble .club-bad{color:#9b1f2a}
html[data-theme="dark"] .cg-bubble{background:linear-gradient(180deg,#EDE0CA,#D9C49E)}

.cg.m-joy .cg-ava{animation:cgHop .7s cubic-bezier(.3,1.6,.5,1)}
.cg.m-sad .cg-ava{animation:cgNo .6s ease}
.cg.m-talk .cg-ava{animation:cgNod .5s ease}
.cg.m-joy .cg-bubble,.cg.m-sad .cg-bubble,.cg.m-talk .cg-bubble{animation:cgPop .32s cubic-bezier(.3,1.5,.6,1)}
.cg.m-joy .cg-bubble{box-shadow:0 3px 0 rgba(0,0,0,.38),0 0 0 2px #f1c40f,0 0 20px rgba(241,196,15,.5)}
.cg.m-sad .cg-bubble{box-shadow:0 3px 0 rgba(0,0,0,.38),0 0 0 2px rgba(192,57,43,.6)}
@keyframes cgHop{0%,100%{transform:none}35%{transform:translateY(-9px) scale(1.07)}62%{transform:translateY(0) scale(1.04,.96)}}
@keyframes cgNo{0%,100%{transform:none}20%{transform:rotate(-10deg)}45%{transform:rotate(9deg)}70%{transform:rotate(-5deg)}}

@keyframes cgPop{0%{transform:scale(.96);opacity:.55}100%{transform:none;opacity:1}}

@keyframes cgBlink{to{opacity:.55}}
.cg .cg-wide{display:block;width:100%;max-width:400px;margin:10px auto 0;font-size:16px;padding:12px}

.hh.red{color:#b3243a}

.hh.w::after{background:#3fae72}.hh.l::after{background:#e85a4a}.hh.t::after{background:#c9973f}

.cg .hl-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}

/* Мемори */

.cg .mem-grid{max-width:340px;margin:0 auto;padding:12px;border-radius:18px;background:radial-gradient(130% 100% at 50% 0%,#24563a,#143421 70%,#0d2717);border:3px solid #5a3a1c;box-shadow:inset 0 0 0 2px #c9973f,inset 0 0 26px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.45)}

const CPU = (() => {
    const cores = Math.max(2, Math.min(8, navigator.hardwareConcurrency || 4));
    const workers = [], load = new Array(cores).fill(0), cbs = new Map();
    let seq = 1, rr = 0;

    const workerCode = `
    const R = n => Math.random()*n|0;
    function findM3(G){
        const m=new Set();
        for(let r=0;r<6;r++)for(let c=0;c<6;c++){
            const i=r*6+c,v=G[i];if(v<0)continue;
            if(c<4&&G[i+1]==v&&G[i+2]==v){m.add(i);m.add(i+1);m.add(i+2);}
            if(r<4&&G[i+6]==v&&G[i+12]==v){m.add(i);m.add(i+6);m.add(i+12);}
        }
        return m;
    }
    function canMoveM3(G){
        for(let i=0;i<36;i++)for(const j of[i+1,i+6]){
            if(j>35||(j==i+1&&j%6==0))continue;
            const t=G[i];G[i]=G[j];G[j]=t;
            const ok=findM3(G).size>0;
            G[j]=G[i];G[i]=t;
            if(ok)return true;
        }
        return false;
    }
    self.onmessage = function(e){
        const {id, cmd, p} = e.data;
        let res = null;
        if(cmd === 'path'){
            const {grid, wid, hei, sc, sr, tc, tr, blkSet} = p;
            const idx = (c,r)=>r*wid+c, start=idx(sc,sr), target=idx(tc,tr);
            const open=[start], cameFrom={}, gScore={[start]:0}, fScore={[start]:Math.abs(sc-tc)+Math.abs(sr-tr)};
            let curr = -1;
            while(open.length>0){
                open.sort((a,b)=>fScore[a]-fScore[b]);
                curr=open.shift();
                if(curr===target)break;
                const c=curr%wid, r=(curr/wid)|0;
                for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
                    const nc=c+dc, nr=r+dr, n=idx(nc,nr);
                    if(nc<0||nc>=wid||nr<0||nr>=hei)continue;
                    const ch = (grid[nr]&&grid[nr][nc])||'T';
                    if(blkSet.includes(ch))continue;
                    const tg2=gScore[curr]+1;
                    if(tg2 < (gScore[n]??1e9)){
                        cameFrom[n]=curr; gScore[n]=tg2; fScore[n]=tg2+Math.abs(nc-tc)+Math.abs(nr-tr);
                        if(!open.includes(n))open.push(n);
                    }
                }
            }
            if(curr===target){
                const path=[];
                while(cameFrom[curr]!==undefined){path.unshift(curr);curr=cameFrom[curr];}
                res = path;
            }
        } else if(cmd === 'm3gen'){
            let G, tries=0;
            do{ G=Array.from({length:36},()=>R(6)); }while((findM3(G).size||!canMoveM3(G))&&++tries<300);
            res = G;
        } else if(cmd === 'hillChunk'){
            const {chunkIdx, chunkLen} = p;
            const startX = chunkIdx * chunkLen, endX = startX + chunkLen;
            const coins = [], fuels = [], props = [];
            for(let x = Math.max(320, startX + 120); x < endX - 90; x += 240 + R(120)){
                const big = R(6) === 0;
                for(let k=0; k<3; k++) coins.push({x: x + k*26, val: big && k===1 ? 3 : 1, got: false});
            }
            const fuelX = startX + 460 + R(260);
            if(fuelX > 340) fuels.push({x: fuelX, got: false});
            for(let x = Math.max(250, startX + 50); x < endX; x += 75 + R(65)){
                props.push({x, type: R(4), s: 0.75 + Math.random()*0.55});
            }
            res = {chunkIdx, coins, fuels, props};
        }
        self.postMessage({id, res});
    };`;

    try {
        const url = URL.createObjectURL(new Blob([workerCode], {type: 'application/javascript'}));
        for(let i=0;i<cores;i++){
            const w = new Worker(url);
            w.onmessage = e => {
                const {id, res} = e.data;
                load[i] = Math.max(0, load[i]-1);
                const cb = cbs.get(id);
                if(cb){ cbs.delete(id); cb(res); }
            };
            w.onerror = () => { load[i] = Math.max(0, load[i]-1); };
            workers.push(w);
        }
    } catch(e){}

    function run(cmd, p, fallbackFn){
        if(!workers.length) return Promise.resolve(fallbackFn());
        return new Promise(resolve => {
            const id = seq++;
            let cIdx = rr % cores;
            for(let k=1;k<cores;k++){ const ix=(rr+k)%cores; if(load[ix]<load[cIdx]) cIdx=ix; }
            rr = (cIdx + 1) % cores;
            load[cIdx]++;
            const tmr = setTimeout(() => {
                if(cbs.has(id)){ cbs.delete(id); load[cIdx]=Math.max(0,load[cIdx]-1); resolve(fallbackFn()); }
            }, 500);
            cbs.set(id, res => { clearTimeout(tmr); resolve(res ?? fallbackFn()); });
            workers[cIdx].postMessage({id, cmd, p});
        });
    }
    return { run };
})();

let actx = null, masterGain = null;
let soundMuted = false;
try { soundMuted = localStorage.getItem("stepan_muted") === "1"; } catch(e){}

function initAudio(){
    if(!actx){
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if(AudioCtx){
            actx = new AudioCtx();
            masterGain = actx.createGain();
            masterGain.gain.setValueAtTime(soundMuted ? 0 : 0.22, actx.currentTime);
            masterGain.connect(actx.destination);
        }
    }
    if(actx && actx.state === 'suspended') {
        actx.resume().catch(()=>{});
    }
}
window.addEventListener('pointerdown', () => initAudio(), {once:true});
window.addEventListener('keydown', () => initAudio(), {once:true});

function toggleSound(){
    soundMuted = !soundMuted;
    try { localStorage.setItem("stepan_muted", soundMuted ? "1" : "0"); } catch(e){}
    initAudio();
    if(masterGain && actx){
        masterGain.gain.setValueAtTime(soundMuted ? 0 : 0.22, actx.currentTime);
    }
    hap('selection');
    const sEl = $("#snd-ic");
    if(sEl) sEl.textContent = soundMuted ? "🔇" : "🔊";
    toast(soundMuted ? "Звук выключен 🔇" : "Звук включен 🔊");
}

const sfx = {
    tap(pitch=1){
        if(soundMuted) return; initAudio(); if(!actx || !masterGain) return;
        try{
            const now = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(140 * pitch, now);
            o.frequency.exponentialRampToValueAtTime(50 * pitch, now + 0.04);
            g.gain.setValueAtTime(0.18, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
            o.connect(g); g.connect(masterGain);
            o.start(now); o.stop(now + 0.045);
        }catch(_){}
    },
    coin(){
        if(soundMuted) return; initAudio(); if(!actx || !masterGain) return;
        try{
            const now = actx.currentTime;
            [987.77, 1318.51].forEach((f, idx) => {
                const o = actx.createOscillator(), g = actx.createGain();
                o.type = 'sine';
                const st = now + idx * 0.04;
                o.frequency.setValueAtTime(f, st);
                o.frequency.exponentialRampToValueAtTime(f * 1.05, st + 0.18);
                g.gain.setValueAtTime(0, now);
                g.gain.setValueAtTime(0.14, st);
                g.gain.exponentialRampToValueAtTime(0.001, st + 0.22);
                o.connect(g); g.connect(masterGain);
                o.start(st); o.stop(st + 0.23);
            });
        }catch(_){}
    },
    win(){
        if(soundMuted) return; initAudio(); if(!actx || !masterGain) return;
        try{
            const now = actx.currentTime;
            [523.25, 659.25, 783.99].forEach((f, idx) => {
                const o = actx.createOscillator(), g = actx.createGain();
                o.type = 'triangle';
                const st = now + idx * 0.07;
                o.frequency.setValueAtTime(f, st);
                g.gain.setValueAtTime(0, now);
                g.gain.setValueAtTime(0.15, st);
                g.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
                o.connect(g); g.connect(masterGain);
                o.start(st); o.stop(st + 0.36);
            });
        }catch(_){}
    },
    jackpot(){
        if(soundMuted) return; initAudio(); if(!actx || !masterGain) return;
        try{
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
            notes.forEach((f, i) => {

                tg.HapticFeedback.impactOccurred(style);

                tg.HapticFeedback.impactOccurred('light');

            if(style==='heavy'||style==='error') navigator.vibrate(35);

};

function sparkleBurst(x, y, count=16, color="#f6c343"){
    try{
        for(let i=0; i<count; i++){
            const p = document.createElement("div");
            p.className = "sparkle-particle";
            const angle = (i / count) * 2 * Math.PI + (Math.random() - 0.5) * 0.4;
            const dist = 32 + Math.random() * 56;
            const tx = Math.cos(angle) * dist, ty = Math.sin(angle) * dist;
            p.style.setProperty("--tx", `${tx}px`);
            p.style.setProperty("--ty", `${ty}px`);
            p.style.left = `${x || (window.innerWidth / 2)}px`;
            p.style.top = `${y || (window.innerHeight * 0.4)}px`;
            p.style.background = color;
            p.style.color = color;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 700);
        }
    }catch(e){}
}

/* ===================== СЕРВЕРНАЯ ЭКОНОМИКА =====================
   В Telegram все монеты/кристаллы/покупки считает сервер (/api/econ).
   Клиент показывает результат сразу (оптимистично), а потом сверяется
   с серверным кошельком. Результаты слотов/колеса/карт/мин решает сервер.
   Без Telegram (просто браузер) игра работает локально, как раньше. */
const ECON_KEYS=["coins","crys","total","xp","lvl","house","owned","items","hcUpg","twin","fish","fishCaught","claimed","dailyBonus","achClaimed"];
const ECON_TAB={world:"world",home:"world",shop:"world",quest:"world",fish:"fish",m3:"m3",race:"race",berry:"berry",blockblast:"bb",cranebuild:"crane",bubble:"bubble"};
let econOn=false,econQ=Promise.resolve(),econBusy=0,econHold=0,econLast=null,econAcc={},econV=0,econTmr=null,econMute=0,econForce=null,econWait=false,econMemPairs=0,econMemLive=false;
/* вышел из «Памяти» не доиграв — сервер всё равно заплатит за найденные пары */
function econMemEnd(){if(!econOn||!econMemLive)return;econMemLive=false;econ("game_end",{g:"memory",pairs:econMemPairs,left:0});}
const econSleep=ms=>new Promise(z=>setTimeout(z,ms));
function econRid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,12);}
async function econPost(op,args){
    const rid=econRid();
    for(let i=0;i<4;i++){
        try{
            const r=await fetch(`${API_BASE}/api/econ`,{method:"POST",keepalive:true,
                headers:{"Content-Type":"application/json","X-Telegram-Init-Data":getInitData()},
                body:JSON.stringify({op,args:args||{},rid})});
            if(r.status===429){await econSleep(1500);continue;}
            if(!r.ok)throw new Error("econ "+r.status);
            return await r.json();
        }catch(e){if(i===3)throw e;await econSleep(700*(i+1));}
    }
    return null;
}
function econSend(op,args){
    econBusy++;
    const p=econQ.then(()=>econPost(op,args))
        .then(r=>{if(r&&r.wallet)econLast=r.wallet;return r;})
        .catch(e=>{console.warn("econ",op,e);return null;})
        .finally(()=>{econBusy--;econApply();});
    econQ=p;
    return p;
}
function econFlushEarn(){
    if(!econOn)return;
    if(econTmr){clearTimeout(econTmr);econTmr=null;}
    if(!Object.keys(econAcc).length)return;
    const e=econAcc;econAcc={};

}
function econAdd(kind,n,src){
    if(!econOn||econMute>0||!(n>0))return;
    src=src||econForce||ECON_TAB[document.body.dataset.tab]||"misc";
    const o=econAcc[src]||(econAcc[src]={});
    o[kind]=(o[kind]||0)+Math.floor(n);
    if(!econTmr)econTmr=setTimeout(econFlushEarn,3000);
}
function econApply(){
    if(!econLast||econBusy>0||econHold>0)return;
    const w=econLast;econLast=null;
    if(typeof w.econV==="number"){if(w.econV<econV)return;econV=w.econV;}
    let c=0,x=0,f=0;
    for(const k in econAcc){const o=econAcc[k];c+=o.c||0;x+=o.x||0;f+=o.f||0;}
    for(const k of ECON_KEYS)if(k in w)rawS[k]=JSON.parse(JSON.stringify(w[k]));
    rawS.coins+=c;rawS.total+=c;rawS.xp+=x;rawS.fish+=f;
    if(!Array.isArray(rawS.owned)||!rawS.owned.includes(rawS.hat))rawS.hat=0;
    try{hud();}catch(_){}
}

async function econGame(op,args,holdMs){
    if(econWait)return null;
    econWait=true;econHold++;
    let r=null;
    try{r=await econ(op,args);}finally{econWait=false;}
    if(!r||!r.ok){econHold--;econApply();econFail(r);return null;}
    setTimeout(()=>{econHold=Math.max(0,econHold-1);econApply();},holdMs);
    return r.res;
}

async function putServerSave(snapshot,initData=getInitData()){
    const response=await fetch(`${API_BASE}/api/save`,{
        method:"PUT",
        headers:{"Content-Type":"application/json","X-Telegram-Init-Data":initData},
        body:JSON.stringify({state:JSON.parse(snapshot)}),
        keepalive:true
    });
    if(!response.ok)throw new Error("Save API returned "+response.status);
    return response.json().catch(()=>({ok:true}));
}

async function flushServerSave(){
    if(!gameReady||!getInitData()||serverSaveInFlight||!pendingServerSave)return;
    if(saveRetryTmr){clearTimeout(saveRetryTmr);saveRetryTmr=null;}
    const snapshot=pendingServerSave;pendingServerSave=null;serverSaveInFlight=true;
    try{await putServerSave(snapshot)}
    catch(e){
        if(!pendingServerSave)pendingServerSave=snapshot;
        if(!saveRetryTmr)saveRetryTmr=setTimeout(()=>{saveRetryTmr=null;flushServerSave()},5000);
    }
    finally{
        serverSaveInFlight=false;
        if(pendingServerSave&&!saveRetryTmr)queueMicrotask(()=>flushServerSave());
    }
}

async function startGame(){

    if(!initData){gameReady=true;go("world");return;}
    try{
        const ac=new AbortController();const toId=setTimeout(()=>ac.abort(),3500);
        const response=await fetch(`${API_BASE}/api/save`,{headers:{"X-Telegram-Init-Data":initData},cache:"no-store",signal:ac.signal});clearTimeout(toId);
        if(!response.ok)throw new Error("Save API returned "+response.status);
        const payload=await response.json();
        if(payload.state&&typeof payload.state==="object"&&!Array.isArray(payload.state)){
            Object.assign(S,payload.state);sanitizeState();
        }else{
            const cloud=await readLegacyCloudSave();
            const localTime=Number(legacyLocalState?.t||0),cloudTime=Number(cloud?.t||0);
            if(cloud&&(!legacyLocalState||cloudTime>localTime)){Object.assign(S,cloud);sanitizeState();}
            await putServerSave(JSON.stringify(S),initData);
        }
        econOn=true; econSend("sync");
        gameReady=true;
        go("world");
        setTimeout(()=>{ try{getBerrySprites();}catch(_){} }, 600);
    }catch(e){
        console.warn("Автономный режим:",e);
        try{sanitizeState();}catch(_){}

        try{toast("🌲 Автономный режим (сохранено на устройстве)");}catch(_){}

    }
}

function int_scene(inner, h=290) {
    const w = S.house || 1; 
    let bg="", dec="", rug="", bed="", extras="";
    const twinBed = S.twin ? ASSETS.bedPink : "";
    if (w === 1) { bg = ASSETS.bg1; dec = ASSETS.tumbleweed + ASSETS.boards; } 
    else if (w === 2) { bg = ASSETS.bg2; rug = ASSETS.rugGreen; bed = twinBed + ASSETS.bedBlue; } 
    else if (w === 3) { bg = ASSETS.bg3; rug = ASSETS.rugGreen; dec = ASSETS.shelf; bed = twinBed + ASSETS.bedBlue; } 
    else { bg = ASSETS.bg3; rug = ASSETS.rugStar; dec = ASSETS.shelf + ASSETS.dresser; bed = twinBed + ASSETS.bedBlue; }

    if(w === 4){
        if(S.items.radio) extras += svgHomeItem('radio', 163, 162);
        if(S.items.coffee) extras += svgHomeItem('coffee', 197, 162);
    } else if(w === 3){
        if(S.items.radio) extras += svgHomeItem('radio', 64, 94);
        if(S.items.coffee) extras += svgHomeItem('coffee', 98, 94);
    } else if(w === 2 && (S.items.radio || S.items.coffee)){
        extras += `<rect x="152" y="182" width="56" height="32" rx="4" fill="#8c5830" stroke="#4d2c14" stroke-width="1.5"/>`;
        if(S.items.radio) extras += svgHomeItem('radio', 166, 182);
        if(S.items.coffee) extras += svgHomeItem('coffee', 194, 182);
    }
    if(S.items.doll) extras += svgHomeItem('doll', 92, 266);
    return `<svg class="scene-svg" viewBox="0 0 360 ${h}">
        <defs><clipPath id="bedClip"><rect x="0" y="0" width="360" height="245"/></clipPath></defs>
        ${bg}${rug}${dec}${bed}${extras}${inner}
    </svg>`;
}

            b("xp","Опыт","Frame 34.svg","xp-bar")+
            b("hu","Сытость","Frame 33.svg","ok-bar")+
            b("mo","Радость","Frame 36.svg")+
            b("en","Бодрость","Frame 35.svg","en-bar")
        }</div>`;
    }
    const tEl=$("#hud-t");
    const tHtml=`${ICO.toy} Ур.${S.lvl} <small style="font-weight:600;opacity:.75">${getTitle()}</small> ${S.sick?ICO.pill:''}`;
    if(tEl && tEl._last!==tHtml){tEl.innerHTML=tHtml;tEl._last=tHtml;}
    const sEl=$("#snd-ic"); if(sEl) sEl.textContent = soundMuted ? "🔇" : "🔊";
    const hc=$("#hud-c"), hd=$("#hud-d"), hf=$("#hud-f");
    if(hc) hc.textContent=S.coins;
    if(hd) hd.textContent=S.crys;
    if(hf) hf.textContent=S.fish;
    const setB=(id,v)=>{
        const p=Math.max(0,Math.min(100,Math.round(v)))+"%";
        const bt=$("#ht-"+id), bb=$("#hb-"+id);
        if(bt&&bt.textContent!==p){bt.textContent=p;bb.style.width=p;}
    };
    setB("xp",S.xp/(S.lvl*50)*100);
    setB("hu",S.hunger);
    setB("mo",S.mood);
    setB("en",S.energy);
}

function earn(n, anim=true){
    const bonus = (S.items.vip && S.mapId===1 && n>0) ? Math.ceil(n*1.2) : n;
    S.coins+=bonus; S.total+=bonus; econAdd("c", bonus);
    if(anim&&bonus>0)popText(`+${bonus}`);
    save();
}

function leaveVenueMenu(){
    if((tab==="shop" && S.mapId===2) || (tab==="bar" && S.mapId===1)){
        const [c,r]=Array.isArray(S.pos)?S.pos:(S.mapId===2?[1,1]:[6,2]);
        const candidates=S.mapId===2
            ? [[c+1,r],[c-1,r],[c,r+1],[c,r-1]]
            : [[c,r+1],[c-1,r],[c+1,r],[c,r-1]];
        const spot=candidates.find(([nc,nr])=>nc>=0&&nc<WD()&&nr>=0&&nr<getHei()&&!blk(at(nc,nr)));
        if(spot){
            S.pos=spot; W.pc=spot[0]; W.pr=spot[1]; W.tpc=W.pc; W.tpr=W.pr; save();
        }
    }
    go("world");
}

const BEAR_PET_QUOTES = [
    "Мррр, щекотно! Степан довольно урчит 🐻",
    "Кто лучший мишка на Зюраткуле? Степан!",
    "Тёплые таёжные обнимашки — лучше мёда!",
    "Почесал за ушком — и на душе сразу весна ✨",
    "Урр-мяу... ой, то есть просто УРРР!",

    "Эх, хорошо! Ради этого стоило проснуться!"
];
let lastPetTime = 0;
function petBear(e){
    const now = Date.now();
    if(now - lastPetTime < 320) return;
    lastPetTime = now;
    if(S.sleepUntil && Date.now() < S.sleepUntil){
        toast("Степан спит... Тссс 💤");
        boop(); return;
    }
    sfx.pet(); hap('light');
    S.mood = clamp(S.mood + 3);
    addXp(1);
    hud();
    const x = e ? e.clientX : (window.innerWidth / 2);
    const y = e ? e.clientY : (window.innerHeight * 0.4);
    popHeart(x, y);
    const bearEl = document.querySelector(".bear");
    if(bearEl){
        bearEl.classList.remove("pet-bounce");
        void bearEl.offsetWidth;
        bearEl.classList.add("pet-bounce");
    }
    const q = BEAR_PET_QUOTES[R(BEAR_PET_QUOTES.length)];
    const msgEl = $("#sleep-msg");
    if(msgEl) msgEl.innerHTML = `<span style="color:#d47a3e">${ICO.toy}</span> ${q}`;
    save();
}
function popHeart(x, y){
    try{
        const el = document.createElement("div");
        el.className = "pop-heart";
        el.innerHTML = "❤️";
        el.style.left = `${(x || window.innerWidth/2) - 13}px`;
        el.style.top = `${(y || window.innerHeight*0.35) - 20}px`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 850);
    }catch(_){}
}

function say(m){msg=m;go(tab)}
function feed(e,c,h,m){
    if(e==='pill'&&!S.sick){boop();return say("Степан полностью здоров!");}
    if(S.coins<c){boop();hap('error');return say("Не хватает монеток");}
    S.coins-=c;econLater("buy",{kind:"food",k:e});S.hunger=clamp(S.hunger+h);S.mood=clamp(S.mood+m);S.fed++; addXp(5);
    if(e==='pill'){S.sick=false; chng(); hap('success'); say(`${ICO.pill} Степан выздоровел!`);}
    else {beep();hap();say(`${ICO[e]||ICO.honey} Очень вкусно!`);}

function clubAudio(){ if(soundMuted) return null; try{ initAudio(); }catch(_){} return (actx && masterGain) ? actx : null; }
function clubNoise(t0, dur, type, freq, q, vol, attack=0.004){
    const ctx = clubAudio(); if(!ctx) return;
    try{
        const t = ctx.currentTime + (t0||0), len = Math.max(1, Math.floor(ctx.sampleRate*(dur+0.05)));
        const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
        const s = ctx.createBufferSource(); s.buffer = buf;
        const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
        const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f); f.connect(g); g.connect(masterGain); s.start(t); s.stop(t + dur + 0.05);
    }catch(_){}
}
function clubTone(t0, freq, dur, type, vol, endFreq){
    const ctx = clubAudio(); if(!ctx) return;
    try{
        const t = ctx.currentTime + (t0||0), o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, t);
        if(endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + dur + 0.03);
    }catch(_){}
}

let slotFaces = [0, 2, 4];

function slotReelMarkup(center){ const n = SLOT_SVG.length; return `<div class="slot-strip">${[(center+n-1)%n, center, (center+1)%n].map((ix,i)=>slotSym(ix, i===1)).join("")}</div>`; }
function _slots0(F){
    if(slotBusy) return;
    const m0 = $("#sl-msg");
    if(S.coins < 10){ boop(); hap('error'); if(m0) m0.innerHTML = `<span class="club-bad">Нужно 10 монет!</span>`; return; }
    S.coins -= 10; S.gamesPlayed++; save(); hud(); slotBusy = true;
    const btn = $("#sl-btn"), mach = document.querySelector(".slot-machine");
    if(btn) btn.disabled = true; if(m0) m0.textContent = "Барабаны крутятся…";
    if(mach){ mach.classList.remove("win","jackpot"); mach.classList.add("is-spinning"); }
    const lever = $("#sl-lever"); if(lever){ lever.classList.remove("pull"); void lever.offsetWidth; lever.classList.add("pull"); lever.disabled = true; }
    const led = $("#sl-win"); if(led) led.textContent = "···";
    const n = SLOT_SVG.length, res = F ? F.res.slice() : [R(n), R(n), R(n)], durs = [1150, 1550, 1950];
    clearInterval(slotSp); slotSp = setInterval(()=>sf('reel'), 75);
    res.forEach((r,i)=>{
        const win = $("#sl-reel-" + i); if(!win) return;
        const prev = slotFaces[i] % n, cells = [(prev+n-1)%n, prev, (prev+1)%n];
        for(let k=0;k<18+i*6;k++) cells.push(R(n));
        cells.push((r+n-1)%n, r, (r+1)%n, R(n));
        win.innerHTML = `<div class="slot-strip">${cells.map((ix,k)=>slotSym(ix, k===1)).join("")}</div>`;
        const strip = win.firstElementChild, dist = (cells.length-4)*44;
        win.classList.remove("stop"); win.classList.add("spinning");
        let anim = null;
        try{ anim = strip.animate([{transform:"translateY(0)"},{transform:`translateY(-${dist}px)`}], {duration:durs[i], easing:"cubic-bezier(.2,.65,.25,1.06)", fill:"forwards"}); }catch(_){}

            if(!win.isConnected) return;

            win.innerHTML = slotReelMarkup(r); win.classList.add("stop"); sf('tap', 1.3);
        }, durs[i]);
    });
    slotFaces = res.slice();
    setTimeout(()=>{
        clearInterval(slotSp); slotSp = null; slotBusy = false;
        const mach = document.querySelector(".slot-machine"), m = $("#sl-msg"), btn = $("#sl-btn");

        else if(a===b || b===c || a===c){ prize = 14; kind = 1; }
        const got = prize ? clubBonus(prize) : 0;
        if(prize) earnL(prize, false);
        slotLastWin = got; const ledW = $("#sl-win"); if(ledW){ if(got) countUp(ledW, 0, got, 520); else ledW.textContent = "0"; ledW.classList.toggle("hot", got > 0); }

            if(mach){

                document.querySelectorAll(".slot-symbol-center").forEach(s=>s.classList.add("hit"));
                clubSparkle(mach, 30, "#f1c40f"); coinBurst(mach, 26);

            }
            if(m) m.innerHTML = `<b>${a===5?"Королевский джекпот":"Три одинаковых"}! +${got}</b> ${ICO.coin}`;
        } else if(kind===1){
            sf('win'); hap('light');
            if(mach){ mach.classList.add("win"); clubFloat(mach, `+${got}`); }

    const k = cands[R(cands.length)], jit = Math.random()*24 - 12;

const DART_NUMS = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
const DART_BOARD = (() => {
    const P = (r, a) => `${(r*Math.cos(a)).toFixed(2)} ${(r*Math.sin(a)).toFixed(2)}`;
    const wedge = (r1, r2, a0, a1) => `M${P(r2,a0)}A${r2} ${r2} 0 0 1 ${P(r2,a1)}L${P(r1,a1)}A${r1} ${r1} 0 0 0 ${P(r1,a0)}Z`;
    let g = "";
    for(let i = 0; i < 20; i++){
        const a0 = (i*18 - 99) * Math.PI/180, a1 = a0 + 18*Math.PI/180, odd = i % 2;
        g += `<path d="${wedge(48,64,a0,a1)}" fill="${odd ? "#efe2c4" : "#1d1a17"}"/><path d="${wedge(12,42,a0,a1)}" fill="${odd ? "#efe2c4" : "#1d1a17"}"/>`;
        g += `<path d="${wedge(64,72,a0,a1)}" fill="${odd ? "#2f8f5b" : "#c0392b"}"/><path d="${wedge(42,48,a0,a1)}" fill="${odd ? "#2f8f5b" : "#c0392b"}"/>`;
        const am = a0 + 9*Math.PI/180;
        g += `<text x="${(80*Math.cos(am)).toFixed(1)}" y="${(80*Math.sin(am)+3.4).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="900" fill="#f3e6cf">${DART_NUMS[i]}</text>`;
    }
    const wires = Array.from({length:20}, (_,i) => { const a = (i*18 - 99) * Math.PI/180; return `M${P(12,a)}L${P(72,a)}`; }).join("");
    return `<circle r="92" fill="#3a2412" stroke="#c9973f" stroke-width="3"/><circle r="88" fill="#141110"/>${g}<path d="${wires}" stroke="#b8b0a0" stroke-width=".5" opacity=".7"/>`
        + `<g fill="none" stroke="#b8b0a0" stroke-width=".6" opacity=".8"><circle r="72"/><circle r="64"/><circle r="48"/><circle r="42"/><circle r="12"/></g>`
        + `<circle r="12" fill="#2f8f5b" stroke="#b8b0a0" stroke-width=".6"/><circle r="5.5" fill="#c0392b" stroke="#b8b0a0" stroke-width=".6"/>`;
})();
const DART_PIN = `<g class="dart-in"><ellipse cx="7" cy="14" rx="7" ry="2.4" fill="#000" opacity=".28"/><path d="M0 0 L5 9" stroke="#dcd6cc" stroke-width="1.6" stroke-linecap="round"/><path d="M5 9 L11 19" stroke="#c9973f" stroke-width="3.6" stroke-linecap="round"/><path d="M11 19 L14 24" stroke="#3a2412" stroke-width="1.6"/><path d="M14 24 l-7 7 l4 1z M14 24 l1 9 l3 -3z" fill="#c0303f" stroke="#5a0f18" stroke-width=".8"/></g>`;
function dartScene(){
    const planks = Array.from({length:9}, (_,i) => `<rect x="${i*40}" y="0" width="40" height="230" fill="${i%2 ? "#3d2513" : "#452a16"}"/><path d="M${i*40+40} 0V230" stroke="#1e1209" stroke-width="1.5" opacity=".8"/>`).join("");
    return `<div class="dart-wall" aria-label="Мишень для дартса на кедровой стене"><svg viewBox="0 0 360 230" aria-hidden="true">${planks}${CG_LAMP(180, 170)}
<g transform="translate(180 116)"><circle r="98" fill="#000" opacity=".35" transform="translate(3 6)"/>${DART_BOARD}<g id="dart-stuck"></g></g></svg></div>`;
}
function dartStick(dist){
    const g = $("#dart-stuck"); if(!g) return;
    const r = dist <= 7 ? dist/7*5 : dist <= 19 ? 14 + (dist-7)/12*26 : dist <= 40 ? 44 + (dist-19)/21*26 : 96 + Math.min(1, (dist-40)/72)*14;
    const a = Math.random()*Math.PI*2, x = Math.max(-170, Math.min(165, r*Math.cos(a))), y = Math.max(-108, Math.min(96, r*Math.sin(a)));
    while(g.children.length > 2) g.firstElementChild.remove();
    g.insertAdjacentHTML("beforeend", `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">${DART_PIN}</g>`);
}
function throwDart(){
    const btn = $("#dart-btn"), msgEl = $("#dart-msg");
    if(!dartAct){
        if(S.coins < 5){ boop(); hap('error'); return toast("Для броска нужно 5 монет!"); }
        S.coins -= 5; S.gamesPlayed++; save(); hud();
        dartAct = true; dartPos = -100 + R(200); dartDir = R(2) ? 1 : -1;
        if(btn){ btn.innerHTML = "БРОСИТЬ!"; btn.classList.add("armed"); }
        if(msgEl) msgEl.textContent = "Целься! Жми, когда метка будет в красном центре.";
        sfx.whoosh(); loopDarts();
        return;
    }
    dartAct = false; cancelAnimationFrame(dartRaf); hap('heavy');
    const dist = Math.abs(dartPos); let win = 0, txt = "";
    dartStick(dist);
    if(dist <= 7){ win = 50; txt = "В ЯБЛОЧКО! +50 монет!"; sfx.dartHit(true); sparkleBurst(); }
    else if(dist <= 19){ win = 15; txt = "Отличный бросок! +15 монет"; sfx.dartHit(false); sfx.win(); }
    else if(dist <= 40){ win = 5; txt = "В поле мишени: +5 монет"; sfx.dartHit(false); }
    else { txt = "Промах… Дротик ушёл в стену. Ещё раз?"; sfx.boop(); }
    econLater("dart",{dist:Math.round(dist)}); if(win > 0){ earnL(win); const w = $(".dart-wall"); if(w) clubFloat(w, `+${win}`); }
    addXp(4); hud();
    if(btn){ btn.innerHTML = `Ещё бросок · 5 ${ICO.coin}`; btn.classList.remove("armed"); }
    if(msgEl) msgEl.textContent = txt;
}

let fwait=1500,fgold=false,fcatch=null,fcT=0;
function cast(){
    if(!checkState()) return;
    if(fs=="idle"){
        fs="wait";msg="";fcatch=null;
        sfx.whoosh(); fwait=S.items.rod?650+R(950):1200+R(1800);
        fgold=R(10)<(S.items.rod?3:1);
        go("fish");hap();
        ft=setTimeout(()=>{fs="bite";msg="Клюёт! Подсекай!";sfx.splash();go("fish");hap('heavy');
            ft=setTimeout(()=>{fs="idle";say("Уплыла… Слишком долго ждал!")},S.items.rod?1750:1400)},fwait)}
    else if(fs=="wait"){clearTimeout(ft);fs="idle";boop();hap('error');say("Слишком рано! Подожди поклёвки")}
    else if(fs=="bite"){
        clearTimeout(ft);fs="idle";
        const isGold=fgold;
        S.fishCaught++;hap('success');
        if(isGold){earn(12);sfx.win();sparkleBurst();msg=`${ICO.toy} Золотая рыбка! +12 монет`;}else{S.fish++;econAdd("f",1,"fish");sfx.coin();msg=`${ICO.fish} Поймал! (+1 рыба в запас)`;}
        addXp(6); S.mood=clamp(S.mood+4);hud();
        fcatch=isGold?"gold":"fish"; go("fish");
        clearTimeout(fcT); fcT=setTimeout(()=>{fcatch=null},1000);
    }
}

const E_SVG = [ICO.crown, ICO.fish, ICO.honey, ICO.tree, ICO.mush, ICO.berry];
function newM3(){
    if(!checkState())return;
    const curMid = ++mid; busy=false; mv=15; cl=0; sel=null; hap();
    CPU.run('m3gen', {}, () => {
        let tries=0, b;
        do{ b=Array.from({length:36},()=>R(6)); G=b; }while((find().size||!canMove())&&++tries<300);
        return b;
    }).then(board => {
        if(curMid !== mid) return;
        G = board; go("m3");
    });
}
function canMove(){for(let i=0;i<36;i++)for(const j of[i+1,i+6]){if(j>35||(j==i+1&&j%6==0))continue;[G[i],G[j]]=[G[j],G[i]];const ok=find().size;[G[i],G[j]]=[G[j],G[i]];if(ok)return true}return false}
function find(){const m=new Set;for(let r=0;r<6;r++)for(let c=0;c<6;c++){const i=r*6+c,v=G[i];if(v<0)continue;if(c<4&&G[i+1]==v&&G[i+2]==v)[i,i+1,i+2].forEach(x=>m.add(x));if(r<4&&G[i+6]==v&&G[i+12]==v)[i,i+6,i+12].forEach(x=>m.add(x))}return m}
const M3_NAMES=["корона","рыбка","мёд","ёлка","гриб","ягоды"];
function draw(clear=new Set){if(!$("#g"))return;$("#g").innerHTML=G.map((v,i)=>`<button type="button" class="t candy-tile ${v>=0?`candy-${v}`:"candy-empty"} ${i===sel?"s":""} ${clear.has(i)?"x":""}" aria-label="${v>=0?`Фишка: ${M3_NAMES[v]}`:"Пустая клетка"}" onclick="pick(${i})">${v>=0?E_SVG[v]:""}</button>`).join("")}
function pick(i){if(busy||mv<=0||tab!="m3")return;hap('light');if(sel==null){sel=i;return draw()}
const a=sel,d=Math.abs(a-i);sel=null;if(!(d==6||(d==1&&(a/6|0)==(i/6|0))))return draw();
[G[a],G[i]]=[G[i],G[a]];if(!find().size){[G[a],G[i]]=[G[i],G[a]];boop();return draw()}
mv--;busy=true;draw();cascade(mid)}
function cascade(k){if(k!==mid)return;const m=find();if(!m.size){busy=false;if(!canMove()){let tries=0;do{G=Array.from({length:36},()=>R(6))}while((find().size||!canMove())&&++tries<300)}
    if(mv<=0){addXp(cl);go("m3")}else{const t=$("#m3top");if(t)t.innerHTML=`<span>Ходы: ${mv}</span><span>Собрано: ${cl} ${ICO.coin}</span>`;draw()}return}

const DPR = Math.min(window.devicePixelRatio || 1, 2);
function setupCanvas(id, w, h){
    const selId = id.startsWith('#') ? id : '#' + id;
    const c=$(selId); if(!c)return null;
    const ctx=c.getContext('2d', {alpha: false});
    const maxW = Math.min(450, (c.parentElement&&c.parentElement.clientWidth-8)||w);
    const cw = maxW, ch = Math.round(cw*h/w);
    c.width=Math.round(cw*DPR); c.height=Math.round(ch*DPR);
    c.style.width=cw+"px"; c.style.height=ch+"px";
    ctx.setTransform(DPR*cw/w,0,0,DPR*cw/w,0,0);
    ctx.textAlign='center'; ctx.textBaseline='middle';
    return {c, ctx};
}
function mkSprite(w, h, fn){
    const oc = document.createElement('canvas');
    oc.width = Math.ceil(w * DPR);
    oc.height = Math.ceil(h * DPR);
    const octx = oc.getContext('2d');
    octx.scale(DPR, DPR);
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    fn(octx, w, h);
    return oc;
}
function rrPath(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

window.addEventListener('keydown', e => {
    if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if(e.key === 'Escape'){
        if(typeof tab !== 'undefined' && tab !== 'world'){
            e.preventDefault();
            leaveVenueMenu();
            return;
        }
    }
    if(typeof tab !== 'undefined' && tab === 'world'){
        let dc = 0, dr = 0;
        if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') dr = -1;
        else if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') dr = 1;
        else if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') dc = -1;
        else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') dc = 1;
        else if(e.key === ' ' || e.key === 'Enter'){
            e.preventDefault();
            const curTile = at(W.pc, W.pr);
            if(W.act) W.act(curTile);
            return;
        }
        if(dc !== 0 || dr !== 0){
            e.preventDefault();
            const tc = W.pc + dc, tr = W.pr + dr;
            if(W.go) W.go(tc, tr);
            return;
        }
    }
    if(typeof tab !== 'undefined' && tab === 'cranebuild' && (e.key === ' ' || e.key === 'ArrowDown')){
        e.preventDefault();
        const c = $('#cbcanvas');
        if(c && c.onpointerdown) c.onpointerdown();
        return;
    }
    if(typeof tab !== 'undefined' && tab === 'berry' && (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter')){
        e.preventDefault();
        const c = $('#ycanvas');
        if(c && c.onpointerup) c.onpointerup();
        return;
    }
    if(typeof tab !== 'undefined' && tab === 'fish' && (e.key === ' ' || e.key === 'Enter')){
        e.preventDefault();
        if(typeof cast === 'function') cast();
        return;
    }
});

function upgHillCar(k){
    const meta = HC_UPG_META.find(m=>m[0]===k); if(!meta) return;
    const lv = S.hcUpg[k]||1; if(lv>=5) return;
    const cost = meta[2][lv];
