        dynObjs += `<g><path d="M${2.5*TS} ${1.5*TS-8}v8M${6.5*TS} ${1.5*TS-8}v8" stroke="#aeb9b0" stroke-width="2"/><circle cx="${2.5*TS}" cy="${1.5*TS}" r="6" fill="#fff6c9" stroke="#d7c87a"/><circle cx="${6.5*TS}" cy="${1.5*TS}" r="6" fill="#fff6c9" stroke="#d7c87a"/></g>`;
        dynObjs += `<g transform="translate(${4*TS+24} ${3*TS+24}) scale(1.22) translate(-24 -24)">${svgShopkeeper(0,0)}</g>`;
        
    } else if(!isClub){
        const hasQuestReady = Q.some((q,i)=>q.v()>=q.n && !S.claimed.includes(i)) || (S.claimed.length>=6 && !S.dailyBonus) || ACH.some((a,i)=>a.v()>=a.n && !S.achClaimed.includes(i));
        dynObjs += svgDen(3*TS, 2*TS, S.house);
        dynL += svgPill(3*TS, 2*TS, "Берлога");
        dynL += svgPill(9*TS, 8*TS, "Задания", hasQuestReady);
        if(S.items.hive){
            dynObjs += `<g transform="translate(${11*TS} ${2*TS})"><ellipse cx="24" cy="42" rx="15" ry="5" fill="#0003"/><rect x="14" y="34" width="20" height="7" rx="2" fill="#6b4423"/><ellipse cx="24" cy="30" rx="14" ry="6" fill="#d99126"/><ellipse cx="24" cy="23" rx="13" ry="6" fill="#eba434"/><ellipse cx="24" cy="16" rx="10" ry="5" fill="#f5b841"/><circle cx="24" cy="26" r="3.5" fill="#2a1808"/><circle cx="12" cy="12" r="3" fill="#ffd34d"/><circle cx="34" cy="14" r="3" fill="#ffd34d"/></g>`;
        }
        [[1,6],[12,6],[2,14],[10,15]].forEach(([c,r])=>{
            const x=c*TS, y=r*TS, ready=(W.bush[r*wid+c]||0)<=Date.now();
            dynObjs += `<g transform="translate(${x} ${y})"><ellipse cx="24" cy="41" rx="19" ry="6" fill="#0003"/><circle cx="15" cy="29" r="12" fill="#2e7332"/><circle cx="33" cy="29" r="12" fill="#2e7332"/><circle cx="24" cy="22" r="14" fill="#3d8c40"/><circle cx="20" cy="19" r="9" fill="#52a655"/>${ready?`<circle cx="15" cy="25" r="3.5" fill="#2c5aa0" stroke="#a8c8ff" stroke-width="1"/><circle cx="25" cy="19" r="3.5" fill="#2c5aa0" stroke="#a8c8ff" stroke-width="1"/><circle cx="32" cy="27" r="3.5" fill="#2c5aa0" stroke="#a8c8ff" stroke-width="1"/><circle cx="22" cy="31" r="3.5" fill="#2c5aa0" stroke="#a8c8ff" stroke-width="1"/>`:``}</g>`;
            dynL += svgPill(x,y,"Ягоды");
        });
    }

    const h=new Date().getHours(), nt=h>=22||h<5||document.documentElement.dataset.theme==='dark';
    const tint=isClub ? "rgba(20,5,10,0.10)" : (isShop ? "transparent" : (nt?"rgba(12,24,70,.45)":"transparent"));
    const rn=(!isClub && !isShop && weather===1)?`<div class="rain"></div>`:"";
    const amb=(!isClub && !isShop && nt)?Array.from({length:8},()=>`<i class="ff" style="left:${R(100)}%;top:${R(100)}%;animation-delay:${R(40)/10}s"></i>`).join(""):"";
    const twinEl=S.twin?`<div id="pl2"><svg viewBox="30 20 140 170">${bear(100,130,1,false,TWINOPT)}</svg></div>`:"";
    return `<div id="wv" style="background:${isClub?'#28150b':(isShop?'#34393c':'#558c42')}${isShop?';width:min(100%,372px);height:min(70vh,300px)':''}"><div id="wm"><svg width="${st.Wpx}" height="${st.Hpx}">${st.base}${dynObjs}${st.L}${dynL}</svg><div id="pl"><svg viewBox="30 20 140 170">${bear(100,130,1)}</svg></div>${twinEl}</div>${amb}${rn}<div id="ov" style="background:${tint}"></div></div><div class="msg" id="dk">${isClub?"Игровой Клуб — выбери автомат или зайди в бар!":(isShop?"Потапыч Маркет — выбери отдел или товар":"Тапни по карте — Степан пойдёт")}</div><div class="desktop-kbd-hint">⌨️ Управление: WASD или стрелочки, Пробел — действие, Esc — назад</div>`;
},
init(){
const p=Array.isArray(S.pos)?S.pos:[3,3];W.pc=p[0];W.pr=p[1];
const hei=getHei();
if(W.pr>=hei||blk(at(W.pc,W.pr))){W.pc=S.mapId===1?6:(S.mapId===2?4:3);W.pr=S.mapId===1?9:(S.mapId===2?5:3);}
W.tpc=W.pc;W.tpr=W.pr;W.put();
const wm=$("#wm");if(wm)wm.onpointerdown=e=>{const b=wm.getBoundingClientRect(),scale=S.mapId===2?shopScale():1;W.go(Math.floor((e.clientX-b.left)/(TS*scale)),Math.floor((e.clientY-b.top)/(TS*scale)))};
setTimeout(()=>$("#wm")&&$("#wm").classList.add("tr"),60);W.wk++;
},
put(){
const wv=$("#wv");if(!wv)return;
const hei=getHei(),vw=wv.clientWidth,vh=wv.clientHeight,scale=S.mapId===2?shopScale():1;
const viewW=vw/scale,viewH=vh/scale,mapW=WD()*TS,mapH=hei*TS;
const cx=Math.max(0,Math.min(Math.max(0,mapW-viewW),W.pc*TS+24-viewW/2)),cy=Math.max(0,Math.min(Math.max(0,mapH-viewH),W.pr*TS+24-viewH/2));
const ox=S.mapId===2?Math.max(0,(vw-mapW*scale)/2):0,oy=S.mapId===2?Math.max(0,(vh-mapH*scale)/2):0;
const pl=$("#pl");if(pl)pl.style.transform=`translate3d(${W.pc*TS-7}px,${W.pr*TS-38}px,0)`;
const p2=$("#pl2");if(p2)p2.style.transform=`translate3d(${W.tpc*TS-5}px,${W.tpr*TS-32}px,0)`;
const wm=$("#wm");if(wm)wm.style.transform=`translate3d(${ox}px,${oy}px,0) scale(${scale}) translate3d(${-cx}px,${-cy}px,0)`;
},
say(t){const d=$("#dk");if(d)d.innerHTML=t},
async go(tc,tr){
const hei=getHei();
if(tc<0||tc>=WD()||tr<0||tr>=hei||blk(at(tc,tr))){boop();hap('error');return W.say("Сюда нельзя");}
if(tc==W.pc&&tr==W.pr)return W.act(at(tc,tr));hap();
const reqId = ++W.wk;

const path = await CPU.run('path', {
    grid: getM(), wid: WD(), hei, sc: W.pc, sr: W.pr, tc, tr, blkSet: S.mapId===2?["T","~","W","B","L","M","s"]:["T","~","W","B","L"]
}, () => {
    const id=(c,r)=>r*WD()+c, start=id(W.pc,W.pr), target=id(tc,tr), open=[start], cameFrom={}, gScore={[start]:0}, fScore={[start]:Math.abs(W.pc-tc)+Math.abs(W.pr-tr)}; let curr;
    while(open.length>0){open.sort((a,b)=>fScore[a]-fScore[b]); curr=open.shift(); if(curr===target) break; const c=curr%WD(), r=Math.floor(curr/WD());
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc, nr=r+dr, n=id(nc,nr); if(nc<0||nc>=WD()||nr<0||nr>=hei||blk(at(nc,nr))) continue;
    const tg2 = gScore[curr]+1; if(tg2 < (gScore[n] ?? Infinity)){cameFrom[n]=curr; gScore[n]=tg2; fScore[n]=tg2+Math.abs(nc-tc)+Math.abs(nr-tr); if(!open.includes(n)) open.push(n);}}}
    if(curr!==target) return null;
    const p=[]; while(cameFrom[curr]!==undefined){p.unshift(curr);curr=cameFrom[curr];} return p;
});

if(reqId !== W.wk || tab !== "world") return;
if(!path){boop();return W.say("Не добраться")}
const mk=document.createElement("i");mk.className="mk";mk.style.cssText=`left:${tc*TS+8}px;top:${tr*TS+8}px`;const wm=$("#wm");if(wm){wm.appendChild(mk);setTimeout(()=>mk.remove(),700)}
const pl=$("#pl"),p2=$("#pl2");if(pl)pl.classList.add("walk");if(p2)p2.classList.add("walk");W.say("");let i=0;
const st=()=>{if(reqId!=W.wk||tab!="world")return;if(i>=path.length){if(pl)pl.classList.remove("walk");if(p2)p2.classList.remove("walk");hud();return W.act(at(W.pc,W.pr))}
const n=path[i++],nc=n%WD(),opc=W.pc,opr=W.pr;if(nc!=W.pc){W.fl=nc<W.pc?-1:1;[pl,p2].forEach(p=>{if(p&&p.firstChild)p.firstChild.style.transform=`scaleX(${W.fl})`})}
W.pc=nc;W.pr=Math.floor(n/WD());W.tpc=opc;W.tpr=opr;W.put();S.pos=[W.pc,W.pr];S.steps++;
if(S.twin&&Math.random()<0.05){earn(1);hud();W.say(`${ICO.coin} Подружка нашла монетку! +1`);}
if(S.mapId!==2 && at(W.pc,W.pr)=="g"&&Math.random()<(S.items.compass?0.16:0.08)){if(pl)pl.classList.remove("walk");if(p2)p2.classList.remove("walk");return W.enc()} 
setTimeout(st, S.items.sneakers ? 105 : 195)};st()},
act(k){
if(S.mapId === 2){
    if(k=="u") { openShopSec("upg"); return; }
    if(k=="h") { openShopSec("hats"); return; }
    if(k=="i") { openShopSec("items"); return; }
    if(k=="f") { openShopSec("food"); return; }
    if(k=="x") { S.mapId=0; S.pos=[10,3]; W.pc=10; W.pr=3; W.tpc=10; W.tpr=3; save(); hap(); go("world"); return W.say("Вы вышли из лавки в лес."); }
    return;
}

if(k=="G") { S.mapId=1; S.pos=[6,9]; W.pc=6; W.pr=9; W.tpc=6; W.tpr=9; save(); hap('medium'); chng(); go("world"); return W.say("Добро пожаловать в Игровой Клуб!"); }
if(k=="X") { S.mapId=0; S.pos=[6,7]; W.pc=6; W.pr=7; W.tpc=6; W.tpr=7; save(); hap(); go("world"); return W.say("Вы вышли из клуба в лес."); }
if(k=="U") return go("bar");
if(k=="D") return go("wheel");
if(k=="A") return initDarts();
if(k=="M") return initCatch();
if(k=="O") return initThimbles();
if(k=="1") return initHiLo();
if(k=="2") return initSlots();
if(k=="3") return initCoinFlip();
if(k=="5") return initMines();
if(k=="6") return initMemory();
if(k=="7") return initBJ();
if(k=="8") return initBlockBlast();
if(k=="4") return initCraneBuild();

if(k=="K"){
    S.mapId=2; S.pos=[4,5]; W.pc=4; W.pr=5; W.tpc=4; W.tpr=5; save(); hap('medium'); chng();
    shopSec="all"; go("world"); return W.say("Вы зашли в Лавку Потапыча!");
}

const m={H:"home",Q:"quest",F:"fish"}[k];if(m)return go(m);
if(k=="S")return newM3();
if(k=="R")return initRace();
if(k=="C")return initBubble();
if(k=="Y")return initBerry();
if(k=="Z")return initBlockBlast();
if(k=="b"){const i=W.pr*wid+W.pc,now=Date.now();if((W.bush[i]||0)>now){boop();return W.say("Ягоды ещё не созрели")}W.bush[i]=now+60000;
const bn=(S.items.clover?6:3)+(S.items.basket?2:0); S.berries++; earn(bn); addXp(5); hap('success');chng();S.hunger=clamp(S.hunger+6);S.mood=clamp(S.mood+3);hud();go("world");W.say(`${ICO.berry} Собраны лесные ягоды! +${bn}`)}
},
enc(){W.say(`Лесная белка зовёт сыграть!<br><button class="b" onclick="newM3()">${ICO.blocks} Сыграть</button><button class="b" onclick="W.say('Белка убежала')">Идти дальше</button>`)}
};
startGame();

// ===== Навигация: док, педали =====
const NAV=[['home','Берлога','honey'],['world','Тайга','tree'],['fish','Рыбалка','fish'],['quest','Задания','toy'],['shop','Лавка','coin']];
function chromeHtml(){
  return `<nav id="dock">${NAV.map(n=>`<button type="button" data-go="${n[0]}">${ICO[n[2]]||''}<span>${n[1]}</span></button>`).join('')}</nav>`
   +`<div id="pedals"><button type="button" class="brake" data-pedal="ArrowLeft">ТОРМОЗ</button><button type="button" class="gas" data-pedal="ArrowRight">ГАЗ</button></div>`;
}
document.getElementById("app").insertAdjacentHTML("beforeend",chromeHtml());
function syncChrome(t){
  document.body.dataset.tab=t;
  document.body.dataset.nav=NAV.some(n=>n[0]===t)?'1':'0';
  document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.go===t));
  const m=document.getElementById('main'); if(m){m.classList.remove('fx');void m.offsetWidth;m.classList.add('fx');}
}
document.addEventListener('click',e=>{
  const nb=e.target.closest('#dock button[data-go]'); if(nb){try{tg.HapticFeedback.selectionChanged()}catch(_){} go(nb.dataset.go);return;}
  if(e.target.closest('button')) try{tg.HapticFeedback.impactOccurred('light')}catch(_){}
},true);
['pointerdown','pointerup','pointercancel','pointerleave'].forEach(ev=>document.getElementById('pedals').addEventListener(ev,e=>{
  const b=e.target.closest('button[data-pedal]'); if(!b)return; const dn=(ev==='pointerdown'); RKEYS[b.dataset.pedal]=dn; b.classList.toggle('pressed',dn); if(dn){try{tg.HapticFeedback.impactOccurred('medium')}catch(_){}} e.preventDefault();
},{passive:false}));
window.__chromeReady=true;
syncChrome(tab);

// ===== Тема: берёзы (день) / ели (ночь) =====
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  try{HC_SPR=null; if(typeof tab!=='undefined'&&tab==='race') drawGaragePreview();}catch(_){}
  const b=document.getElementById('theme-btn'); if(b) b.textContent=t==='dark'?'🌙':'☀️';
  try{tg.setHeaderColor(t==='dark'?'#140F0C':'#F5F0E6');tg.setBackgroundColor(t==='dark'?'#140F0C':'#F5F0E6');}catch(_){}
}
function toggleTheme(){
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  try{localStorage.setItem('stepan_theme',t);}catch(_){}
  applyTheme(t); try{hap();}catch(_){}
}
(function(){
  let t=null; try{t=localStorage.getItem('stepan_theme');}catch(_){}
  if(t!=='dark'&&t!=='light') t=((typeof tg!=='undefined'&&tg&&tg.colorScheme)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
  applyTheme(t==='dark'?'dark':'light');
})();

// ===== Звук торможения =====
let _bsT=0,_bsCtx=null;
function brakeSound(){
  if(typeof soundMuted!=='undefined'&&soundMuted) return;
  const n=performance.now(); if(n-_bsT<140) return; _bsT=n;
  try{
    _bsCtx=_bsCtx||new (window.AudioContext||window.webkitAudioContext)(); const c=_bsCtx; if(c.state==='suspended')c.resume();
    const len=Math.floor(c.sampleRate*0.12), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource(); s.buffer=buf; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=4;
    const g=c.createGain(); g.gain.value=0.05; s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }catch(_){}
}
